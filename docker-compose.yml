# ── JPQC — orquestación de servicios ─────────────────────────────────────────
# Uso: copiar .env.example a .env y ejecutar:  docker compose up --build
# La app queda accesible en http://localhost:3000 (y en la IP del servidor en la LAN).

services:
  db:
    image: postgres:16
    container_name: jpqc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Puerto del host 5433 para no chocar con un PostgreSQL nativo en 5432.
      # Dentro de la red de compose la app usa db:5432 (no se ve afectado).
      - "5434:5432"
    volumes:
      - jpqc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jpqc-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro de la red de compose el host de la base es 'db'.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      NODE_ENV: production
      # Modo DEMOSTRACIÓN: puebla datos FICTICIOS al arrancar (seed-demo) y muestra
      # la franja de aviso en la UI. En un despliegue REAL del laboratorio, quitar
      # esta línea (o ponerla en "false") para no inyectar datos de prueba.
      DEMO_MODE: "true"
    ports:
      - "3001:3000"

volumes:
  jpqc_pgdata:
